name: Release

# Publishes a GitHub release with the packaged extension when a version tag
# such as v0.1.0 is pushed. See "Releasing a new version" in README.md.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the tagged commit
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check that the tag matches the version
        run: |
          version="$(node -p "require('./extension/manifest.json').version")"
          package_version="$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_NAME" != "v$version" ] || [ "$package_version" != "$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME, manifest.json ($version) and package.json ($package_version) must match."
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Run the tests
        run: npm test

      - name: Build the extension ZIP
        run: npm run package

      - name: Take the release notes from CHANGELOG.md
        run: |
          awk -v version="$VERSION" '
            index($0, "## " version " ") == 1 { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if ! grep -q '[^[:space:]]' release-notes.md; then
            echo "::error::CHANGELOG.md has no section for version $VERSION."
            exit 1
          fi

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "dist/downhere-$VERSION.zip" \
            --repo "$GITHUB_REPOSITORY" \
            --title "DownHere $VERSION" \
            --notes-file release-notes.md \
            --verify-tag
