name: Release

# Builds the extension ZIP and publishes it in a GitHub release for a version
# tag such as v0.1.0. It runs when a release is published on GitHub and when a
# version tag is pushed, and does the same work either way, so running twice
# for one tag is harmless. See "Releasing a new version" in README.md.
on:
  release:
    types:
      - published
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the tagged commit
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check that the tag matches the version
        run: |
          version="$(node -p "require('./extension/manifest.json').version")"
          package_version="$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_NAME" != "v$version" ] || [ "$package_version" != "$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME, manifest.json ($version) and package.json ($package_version) must match."
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Run the tests
        run: npm test

      - name: Build the extension ZIP
        run: npm run package

      - name: Take the release notes from CHANGELOG.md
        run: |
          awk -v version="$VERSION" '
            index($0, "## " version " ") == 1 { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if ! grep -q '[^[:space:]]' release-notes.md; then
            echo "::error::CHANGELOG.md has no section for version $VERSION."
            exit 1
          fi

      - name: Publish the ZIP in the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          zip="dist/downhere-$VERSION.zip"
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            # The release already exists, for example because it was published
            # on GitHub: attach the ZIP, and add the notes if it has none.
            gh release upload "$GITHUB_REF_NAME" "$zip" --repo "$GITHUB_REPOSITORY" --clobber
            body="$(gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json body --jq .body)"
            if [ -z "$body" ]; then
              gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --notes-file release-notes.md
            fi
          else
            gh release create "$GITHUB_REF_NAME" "$zip" \
              --repo "$GITHUB_REPOSITORY" \
              --title "DownHere $VERSION" \
              --notes-file release-notes.md \
              --verify-tag
          fi
